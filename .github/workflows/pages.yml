# Publishes the playable build to GitHub Pages on every push to main.
#
# Vite builds with a relative base, so the bundle works unmodified from a
# project-pages subpath (/project_MKstickfight/) without any base-href juggling.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # This step fails with "Get Pages site failed" until Pages is switched on
      # for the repository: Settings -> Pages -> Source: GitHub Actions. That
      # is a one-time click and it has to be a person - `enablement: true` was
      # tried and cannot work, because creating a Pages site needs admin
      # permission and the workflow's GITHUB_TOKEN only ever gets write.
      # Everything before this step passes; the bundle is built and tested.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
